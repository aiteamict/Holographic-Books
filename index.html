<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Route Marker · IRC 2-1968, a 3D holographic book</title>
<meta name="description" content="IRC 2-1968, Route Marker Signs for National Highways, as a 3D holographic book: draw the shield, set the numerals, paint it, plant it at the junction." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f0c020'/%3E%3Cpath d='M7 6h18v14c0 4-4 7-9 8-5-1-9-4-9-8z' fill='none' stroke='%23141414' stroke-width='2'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='Arial' font-weight='700' font-size='11' fill='%23141414'%3ENH%3C/text%3E%3C/svg%3E" />
<script>
  // older phone browsers lack CanvasRenderingContext2D.roundRect; the cards and chips draw with it
  if (window.CanvasRenderingContext2D && !CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      r = Math.min(Array.isArray(r) ? r[0] : (r || 0), w / 2, h / 2);
      this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath(); return this;
    };
  }
  // surface uncaught errors on screen: on a phone there is no console to read
  addEventListener('error', e => document.dispatchEvent(new CustomEvent('book:error', { detail: String(e.message || e.error || 'error') })));
  addEventListener('unhandledrejection', e => document.dispatchEvent(new CustomEvent('book:error', { detail: String(e.reason && e.reason.message || e.reason || 'error') })));
  document.addEventListener('book:error', e => {
    let el = document.getElementById('booterr');
    if (!el) { el = document.createElement('div'); el.id = 'booterr'; el.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99;padding:10px 14px;border-radius:12px;background:rgba(120,20,30,.92);color:#fff;font:13px/1.4 system-ui,sans-serif;white-space:pre-wrap'; document.body.append(el); }
    el.textContent = 'Something went wrong: ' + e.detail;
  });
</script>
<style>
  :root { --ink:#e8eef6; --ink2:#9fb0c4; --cyan:#58d6ff; --amber:#ffa24a; --glass:rgba(18,24,34,.62); --edge:rgba(255,255,255,.12); --sans:"Inter","Segoe UI",system-ui,Arial,sans-serif; }
  html,body{margin:0;height:100%;overflow:hidden;background:#07080c;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  canvas#c{display:block;width:100%;height:100%;touch-action:none;outline:none}
  #ui{position:fixed;inset:0;pointer-events:none}
  #ui>*{pointer-events:auto}
  /* the UI scales with the viewport so it never swallows the scene on a 1080p laptop at 150–175 % scaling */
  html{font-size:clamp(11px,.9vw,15px)}
  .brand{position:absolute;left:1.6rem;top:1.3rem}
  .brand h1{margin:0;font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
  .brand p{margin:3px 0 0;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}
  .glass{background:var(--glass);border:1px solid var(--edge);border-radius:18px;backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .step{position:absolute;left:1.6rem;bottom:1.4rem;display:flex;align-items:center;gap:.9rem;padding:.6rem 1.1rem .6rem .9rem;max-width:26rem}
  .step .n{font-size:1.7rem;font-weight:800;color:var(--cyan);min-width:2.4rem}
  .step b{display:block;font-size:1rem}
  .step span{font-size:.8rem;color:var(--ink2)}
  .again{position:absolute;left:29rem;bottom:1.4rem;width:3.6rem;height:3.6rem;border-radius:50%;display:grid;place-items:center;font:700 .6rem var(--sans);letter-spacing:.12em;color:var(--ink);cursor:pointer;gap:3px}
  .again svg{width:1.2rem;height:1.2rem}
  .actions{position:absolute;right:1.6rem;bottom:1.4rem;display:flex;flex-wrap:wrap;gap:.45rem;justify-content:flex-end;max-width:min(44vw,38rem)}
  .actions button{font:600 .8rem var(--sans);color:var(--ink);padding:.55rem .95rem;border-radius:999px;cursor:pointer;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(12px);transition:background .2s,transform .15s}
  .actions button:hover{background:rgba(88,214,255,.18)}
  .actions button.hid{display:none}
  .steps{position:absolute;left:1.6rem;bottom:6.6rem;display:flex;gap:.35rem;padding:.35rem .45rem;border-radius:999px;max-width:34rem;flex-wrap:wrap}
  .steps button{font:600 .72rem var(--sans);color:var(--ink2);padding:.4rem .75rem;border-radius:999px;cursor:pointer;background:transparent;border:1px solid transparent;transition:background .2s,color .2s}
  .steps button.done{color:var(--ink)}
  .steps button.on{color:#0b1420;background:var(--amber,#ffa24a);border-color:transparent}
  .steps button:last-child.on{background:#7dffb0}
  .steps button:hover:not(.on){background:rgba(88,214,255,.14);color:var(--ink)}
  .actions button:active{transform:scale(.97)}
  .actions button.on{border-color:var(--cyan);color:var(--cyan)}
  .dots{position:absolute;right:1.6rem;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:.8rem;padding:.9rem .6rem;border-radius:999px;align-items:center}
  .dots button{width:.7rem;height:.7rem;border-radius:50%;border:0;background:rgba(255,255,255,.22);cursor:pointer;padding:0}
  .dots button.on{background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
  .dots button.arrow{background:none;color:var(--ink);font-size:.85rem;width:auto;height:auto}
  /* captions sit top-centre, clear of the hologram and the page text */
  .caption{position:absolute;left:50%;bottom:6.6rem;transform:translateX(-50%);padding:.6rem 1rem;max-width:30rem;font-size:.95rem;line-height:1.35;border-left:3px solid var(--cyan);opacity:0;transition:opacity .35s}
  .caption.show{opacity:1}
  .caption small{display:block;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);margin-bottom:3px}
  .hint{position:absolute;left:50%;bottom:1.8rem;transform:translateX(-50%);padding:.6rem 1rem;font-size:.8rem;color:var(--ink2)}
  .hint b{color:var(--ink)}
  .credit{position:absolute;right:1.6rem;bottom:.4rem;font-size:.65rem;color:var(--ink2)}
  .mute{position:absolute;right:1.6rem;top:1.3rem;width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;color:var(--ink);cursor:pointer;font-size:1rem}
  .mute.off{color:var(--ink2)}
  #enter{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#1a1420 0%,#0a0b10 60%,#060709 100%);z-index:5;transition:opacity .6s}
  #enter .m{text-align:center}
  #enter .shield{width:84px;height:112px;margin:0 auto 18px}
  #enter h2{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em}
  #enter p{margin:8px 0 26px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2)}
  #enter button{font:800 14px var(--sans);letter-spacing:.2em;padding:16px 44px;border-radius:999px;border:0;cursor:pointer;color:#1a1200;background:linear-gradient(90deg,#ffd76a,#ff9f3f);box-shadow:0 0 40px rgba(255,170,60,.45)}
  #enter small{display:block;margin-top:14px;color:var(--ink2);font-size:12px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .sr button:focus{position:fixed;left:16px;top:16px;width:auto;height:auto;clip:auto;z-index:9;padding:8px 12px;background:#000;color:#fff}
  .sheet{position:absolute;left:12px;right:12px;bottom:208px;max-height:36vh;overflow:auto;padding:14px 16px;font:15px/1.45 Georgia,serif;color:var(--ink);display:none}
  .sheet h3{margin:0 0 6px;font:italic 700 20px Georgia,serif}.sheet small{display:block;color:var(--cyan);letter-spacing:.14em;text-transform:uppercase;font:600 10px var(--sans);margin-bottom:6px}.sheet p{margin:0 0 8px}.sheet b{color:#fff}
  .sheet-toggle{display:none;position:absolute;left:12px;bottom:26px;padding:10px 14px;font:600 13px var(--sans);color:var(--ink);border-radius:999px;cursor:pointer}
  /* desktop: the page text as a crisp reading panel over the left page, like a card laid on the book */
  /* desktop: no reading panel and no toggle; the printed page is read through the magnifier on hover */
  @media (min-width:821px){ .sheet,.sheet-toggle{display:none!important} }
  .lens{position:absolute;width:17rem;height:17rem;border-radius:50%;overflow:hidden;pointer-events:none;display:none;border:2px solid rgba(255,255,255,.3);box-shadow:0 1rem 3rem rgba(0,0,0,.6),inset 0 0 2.4rem rgba(0,0,0,.35);background:#f4efe6;z-index:6}
  .lens canvas{width:100%;height:100%;display:block}
  .gpanel{display:none}
  @media (max-width:820px),(max-height:520px){
    .gpanel{display:block;position:absolute;left:12px;right:12px;bottom:238px;padding:10px 14px 12px;font:13px/1.4 var(--sans);color:var(--ink);border-radius:14px}
    /* the keyboard mirror becomes a visible chip row on touch screens: a finger-sized way to reach small 3-D targets */
    .sr#mirror{position:absolute;left:12px;right:80px;bottom:134px;top:auto;width:auto;height:auto;clip:auto;overflow-x:auto;overflow-y:hidden;display:flex;gap:6px;white-space:nowrap;padding:2px 0}
    .sr#mirror:empty{display:none}
    .sr#mirror button{flex:0 0 auto;max-width:62vw;overflow:hidden;text-overflow:ellipsis;font:600 12px var(--sans);color:var(--ink2);padding:7px 11px;border-radius:999px;background:rgba(18,24,34,.7);border:1px solid var(--edge)}
    .steps{bottom:182px}
    .gpanel small{display:block;color:var(--amber);font:700 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
    .gpanel p{margin:0 0 8px}
    .gpanel .opts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
    .gpanel .opts button,.gpanel .next{font:600 13px var(--sans);color:var(--ink);padding:8px 12px;border-radius:999px;background:rgba(88,214,255,.12);border:1px solid rgba(88,214,255,.45)}
    .gpanel .opts button.ok{background:rgba(125,255,176,.25);border-color:#9dffc2}
    .gpanel .opts button.bad{background:rgba(255,107,107,.25);border-color:#ff9a9a}
    .gpanel .next{background:var(--amber);color:#0b1420;border-color:transparent}
    .sheet{bottom:238px}
  }
  @media (max-width:820px),(max-height:520px){.sheet.open{display:block}.sheet-toggle{display:block}.step{display:none}.steps{left:12px;right:12px;bottom:182px;max-width:none;justify-content:flex-start}.again{left:auto;right:12px;bottom:26px;width:56px;height:56px}.actions{left:12px;right:80px;bottom:88px;max-width:none;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}.actions button{flex:0 0 auto}.dots{display:none}.caption{bottom:auto;top:84px;max-width:92vw}.hint{display:none!important}.credit{display:none}.brand h1{font-size:17px}.mute{right:12px;top:12px}}
  /* phones upright: a compact bottom stack, and the page arrows as big buttons on the right edge */
  @media (max-width:820px) and (orientation:portrait){
    .dots{display:flex;flex-direction:column;align-items:center;left:auto;right:8px;top:50%;bottom:auto;transform:translateY(-50%);padding:4px;gap:2px;border-radius:999px}
    .dots button:not(.arrow){display:none}
    .dots .arrow{width:46px;height:46px;font-size:20px;color:var(--ink);background:transparent;border:0;border-radius:50%}
    .gpanel{bottom:166px;max-height:30vh;overflow:auto;padding:8px 12px 10px;font-size:12.5px}
    .gpanel p{margin:0 0 6px}.gpanel .opts button,.gpanel .next{padding:7px 11px;font-size:12px}
    .sr#mirror{bottom:120px}
    .actions{bottom:72px;right:118px}
    .sheet-toggle{left:auto;right:12px;bottom:72px;padding:8px 10px;font-size:12px}
    .steps{bottom:16px;right:80px;padding:3px 4px;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap}.steps button{flex:0 0 auto;padding:6px 9px;font-size:11px}
    .again{bottom:12px;width:50px;height:50px}
    .sheet{bottom:166px;max-height:40vh}
  }
  /* a phone held sideways: short and wide. Panels stack in the left column; the right half is the hologram's. */
  @media (max-height:520px) and (orientation:landscape){
    .brand h1{font-size:15px}.brand p{display:none}
    .gpanel{left:12px;right:auto;width:46vw;top:52px;bottom:auto;max-height:46vh;overflow:auto;padding:8px 12px 10px;font-size:12px}
    .gpanel p{margin:0 0 6px}.gpanel .opts button,.gpanel .next{padding:6px 10px;font-size:12px}
    .sr#mirror{left:12px;right:auto;width:46vw;bottom:96px}
    .steps{left:12px;right:auto;width:46vw;bottom:54px;padding:3px 4px}.steps button{padding:5px 9px;font-size:11px}
    .actions{left:12px;right:70px;bottom:10px}
    .again{right:10px;bottom:10px;width:44px;height:44px;font-size:8px}
    .sheet-toggle{display:none!important}.sheet{display:none!important}
    .caption{top:8px;left:auto;right:64px;transform:none;max-width:42vw;font-size:12px}
  }
  /* ---- the phone shell: one collapsible card, one toolbar, nothing else over the scene ---- */
  .mshell{display:none}
  body.phone .mshell{display:flex;flex-direction:column;gap:8px;position:absolute;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));pointer-events:none}
  body.phone .mshell>*{pointer-events:auto}
  body.phone .brand,body.phone .dots,body.phone .step,body.phone .again,body.phone .mute,body.phone .hint,body.phone .credit,body.phone .sheet-toggle,body.phone .lens{display:none!important}
  body.phone .caption{top:10px;bottom:auto;left:50%;transform:translateX(-50%);max-width:94vw;font-size:13px}
  body.phone .mcard{border-radius:18px;overflow:hidden}
  body.phone .mhead{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 16px;font:700 15px var(--sans);color:var(--ink);background:transparent;border:0;text-align:left}
  body.phone .mhead .chev{transition:transform .25s;color:var(--ink2)}
  body.phone .mcard.open .mhead .chev{transform:rotate(180deg)}
  body.phone .mbody{display:none;max-height:46vh;overflow:auto;padding:0 12px 12px}
  body.phone .mcard.open .mbody{display:block}
  body.phone .mtabs{display:flex;gap:6px;margin:0 0 8px}
  body.phone .mtabs button{font:600 12px var(--sans);color:var(--ink2);padding:6px 12px;border-radius:999px;background:transparent;border:1px solid var(--edge)}
  body.phone .mtabs button.on{color:#0b1420;background:var(--cyan);border-color:transparent}
  /* the panels, re-homed inside the card: static flow instead of absolute stacking */
  body.phone #gpanel,body.phone #steps,body.phone #actions,body.phone #mirror,body.phone #sheet{position:static;left:auto;right:auto;top:auto;bottom:auto;width:auto;max-width:none;transform:none;background:transparent;border:0;box-shadow:none;backdrop-filter:none;padding:0;margin:0 0 10px}
  body.phone #gpanel{display:block;font-size:13.5px;line-height:1.45}
  body.phone #steps{display:flex;flex-wrap:wrap;gap:6px;overflow:visible;white-space:normal}
  body.phone #actions{display:flex;flex-wrap:wrap;gap:6px;overflow:visible}
  body.phone #mirror{display:flex;flex-wrap:wrap;gap:6px;height:auto;clip:auto;overflow:visible;white-space:normal}
  body.phone #mirror:empty{display:none}
  body.phone #mirror button{max-width:100%;white-space:normal;text-align:left}
  body.phone #sheet{display:none;max-height:none;font-size:14px}
  body.phone .mbody[data-tab="page"] #sheet{display:block}
  body.phone .mbody[data-tab="page"] #gpanel,body.phone .mbody[data-tab="page"] #steps,body.phone .mbody[data-tab="page"] #actions,body.phone .mbody[data-tab="page"] #mirror{display:none}
  body.phone .mbar{display:flex;align-items:center;gap:2px;padding:6px 8px;border-radius:999px}
  body.phone .mbar button{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--ink);font:600 18px var(--sans)}
  body.phone .mbar .primary{background:var(--amber);color:#0b1420;font-size:22px}
  body.phone #m-where{flex:1;min-width:0;text-align:center;font:600 13px var(--sans);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  body.phone .mmenu{position:absolute;left:10px;right:10px;bottom:72px;padding:6px;border-radius:14px;max-height:60vh;overflow:auto}
  body.phone .mmenu button{display:block;width:100%;text-align:left;font:600 14px var(--sans);color:var(--ink);padding:10px 12px;border:0;border-radius:10px;background:transparent}
  body.phone .mmenu button.on{background:rgba(88,214,255,.16);color:var(--cyan)}
  @media (max-height:520px) and (orientation:landscape){
    body.phone .mshell{left:0;right:auto;width:48vw;top:0;bottom:0;justify-content:flex-end}
    body.phone .mbody{max-height:52vh}
    body.phone .mmenu{left:10px;right:auto;width:46vw}
  }
  body.fx .glass,body.fx .actions button{background:rgba(18,24,34,.10);backdrop-filter:none;box-shadow:none;border-color:rgba(255,255,255,.08)}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="3D book: The Route Marker, IRC 2-1968"></canvas>
<div id="ui"></div>
<div id="enter"><div class="m">
  <svg class="shield" viewBox="0 0 450 600" aria-hidden="true"><rect width="450" height="600" rx="12" fill="#f0c020"/><path d="M24 17h176l25 12 25-12h176q7 0 7 7v361c0 120-100 180-208 198-108-18-208-78-208-198V24q0-7 7-7z" fill="none" stroke="#111" stroke-width="10"/><text x="225" y="175" text-anchor="middle" font-family="Arial" font-weight="700" font-size="110" fill="#111">N H</text><text x="225" y="455" text-anchor="middle" font-family="Arial" font-weight="700" font-size="250" fill="#111">42</text></svg>
  <h2>The Route Marker</h2><p>IRC : 2-1968 · a holographic chapter</p>
  <button id="go">ENTER</button><small>Scroll, swipe or use the arrow keys to turn the pages.</small><a id="go-quiet" href="#" style="display:block;margin-top:10px;color:var(--ink2);font-size:12px">Enter without sound</a>
</div></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
